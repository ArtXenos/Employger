spring.application.name=Em-Ployger

# Database connection. Set DB_PASSWORD as an environment variable; never
# write a real password into this file. The defaults match the local
# MariaDB 10.11 server (docs/MARIADB_UPGRADE.md). Override DB_URL and
# DB_USERNAME only to use another server; the URL must start jdbc:mariadb://.
# MariaDB's own driver reports the real server version, so Hibernate
# picks MariaDBDialect by itself.
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3307/employger_db}
spring.datasource.username=${DB_USERNAME:employger_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate's startup "Database info" line prints the JDBC URL, and the
# MariaDB driver puts the password into it. Keep that logger quiet.
logging.level.org.hibernate.orm.connections.pooling=WARN

# Fail fast (10 s) instead of hanging for Hikari's 30 s default when the
# database is down, so users see the "database unavailable" message sooner.
spring.datasource.hikari.connection-timeout=10000

# validate: the app never creates, alters, or drops tables. Do not change
# this to create, create-drop, or update against employger_db.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

# Browsers don't send the session cookie with requests started by other
# sites (second layer of CSRF protection after the token).
server.servlet.session.cookie.same-site=lax