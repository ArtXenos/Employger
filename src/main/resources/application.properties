spring.application.name=Em-Ployger

# Database connection. Set DB_URL, DB_USERNAME and DB_PASSWORD as environment
# variables to override; never write a real password into this file.
# The defaults match the local XAMPP setup (root, no password).
# See docs/DATABASE_ACCOUNT.md for a least-privilege application account.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employger_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail fast (10 s) instead of hanging for Hikari's 30 s default when the
# database is down, so users see the "database unavailable" message sooner.
spring.datasource.hikari.connection-timeout=10000

# validate: the app never creates, alters, or drops tables. Do not change
# this to create, create-drop, or update against employger_db.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080