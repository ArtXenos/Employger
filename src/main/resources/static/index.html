<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Em-Ployger | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">

                <div class="logo">
                    EP
                </div>

                <h1>Em-Ployger</h1>

                <p>Employee Payroll Management System</p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

        </section>

    </main>

    <script src="/csrf.js"></script>
    <script src="/script.js"></script>
    <script src="/password-toggle.js"></script>

</body>
</html>
