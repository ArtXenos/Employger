<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Em-Ployger | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">

                <div class="logo">
                    EP
                </div>

                <h1>Em-Ployger</h1>

                <p>Employee Payroll Management System</p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="button"
                    class="link-button"
                    id="forgotPasswordLink"
                >
                    Forgot password?
                </button>

            </form>

            <!-- Forgot password: a request to the administrators, who give
                 a temporary password in person. Shown instead of the login. -->
            <form id="forgotForm" hidden>

                <h2 class="forgot-title">Forgot your password?</h2>

                <p class="forgot-help">
                    Enter your username. An administrator will be notified,
                    check that it's you, and give you a temporary password in
                    person. You'll choose a new password when you log in with it.
                </p>

                <div class="form-group">

                    <label for="forgotUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="forgotUsername"
                        maxlength="100"
                        autocomplete="username"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="forgotButton"
                >
                    Send request
                </button>

                <p
                    id="forgotMessage"
                    class="login-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="button"
                    class="link-button"
                    id="backToLoginLink"
                >
                    Back to login
                </button>

            </form>

        </section>

    </main>

    <script src="/csrf.js"></script>
    <script src="/script.js"></script>
    <script src="/password-toggle.js"></script>

</body>
</html>
