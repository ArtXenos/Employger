# Test configuration. This file replaces src/main/resources/application.properties
# on the test classpath, so tests run against a throwaway in-memory H2 database
# and can never read or modify the real employger_db.
spring.application.name=Em-Ployger

spring.datasource.url=jdbc:h2:mem:employger_test;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Safe here only because the database above is in-memory and private to the test JVM.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
